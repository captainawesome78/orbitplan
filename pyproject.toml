[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitplan"
version = "0.2.0"
description = "Feasibility planner for inference in orbit: reconcile power, thermal and downlink, and find the binding constraint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "captainawesome78", email = "mailmenaveed88@gmail.com" }]
keywords = ["orbital", "inference", "edge-ai", "satellite", "downlink", "power-budget", "thermal", "space-datacenter", "inter-satellite-link", "laser-mesh"]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Developers",
"Intended Audience :: Science/Research",
"License :: OSI Approved :: Apache Software License",
"Operating System :: OS Independent",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Scientific/Engineering :: Artificial Intelligence",
"Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []

[project.optional-dependencies]
thermal = ["orbitherm>=0.1.0"]

[project.urls]
Homepage = "https://github.com/captainawesome78/orbitplan"
Repository = "https://github.com/captainawesome78/orbitplan"
Issues = "https://github.com/captainawesome78/orbitplan/issues"

[tool.setuptools.packages.find]
include = ["orbitplan*"]
